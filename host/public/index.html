<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Pico Park</title>
  <style>
    body { margin: 0; background: #111; color: #fff; font-family: sans-serif; text-align: center; }
    canvas { background: #1e1e2e; display: block; margin: 10px auto; }
  </style>
</head>
<body>
  <h2>Pico Park - Conectate a: <span id="ip"></span></h2>
  <canvas id="game" width="960" height="540"></canvas>
  <script src="/socket.io/socket.io.js"></script>
  <script>
    document.getElementById('ip').textContent = location.host;
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const socket = io();

    socket.emit('viewer'); // este es el "Host", no un jugador

    socket.on('state', (players) => {
      ctx.fillStyle = '#444';
      ctx.fillRect(0, 520, 960, 40);
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (const p of Object.values(players)) {
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x - 20, p.y - 20, 40, 40);
      }
    });
  </script>
</body>
</html>
