<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Pico Park</title>
  <style>
    body { margin: 0; background: #111; color: #fff; font-family: sans-serif; text-align: center; }
    canvas { background: #1e1e2e; display: block; margin: 10px auto; }
  </style>
</head>
<body>
  <h2>Pico Park - Conectate a: <span id="ip"></span></h2>
  <canvas id="game" width="960" height="540"></canvas>
  <script src="/socket.io/socket.io.js"></script>
  <script>
    document.getElementById('ip').textContent = location.host;
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const socket = io();

    socket.emit('viewer');

    socket.on('state', ({ players, level, door }) => {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // suelo y plataforma
      ctx.fillStyle = '#444';
      ctx.fillRect(0, 500, 300, 40);
      ctx.fillRect(370, 500, 220, 40);
      ctx.fillRect(660, 500, 300, 40);
      ctx.fillRect(400, 410, 160, 20);

      // puerta (verde si está abierta)
      ctx.fillStyle = level.doorOpen ? '#2ecc71' : '#8e44ad';
      ctx.fillRect(door.x - door.w / 2, door.y - door.h / 2, door.w, door.h);

      // llave
      ctx.fillStyle = '#f1c40f';
      ctx.beginPath();
      ctx.arc(level.key.x, level.key.y, 10, 0, Math.PI * 2);
      ctx.fill();

      // jugadores
      for (const p of Object.values(players)) {
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x - 20, p.y - 20, 40, 40);
      }

      // victoria
      if (level.won) {
        ctx.fillStyle = '#fff';
        ctx.font = '60px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('¡NIVEL COMPLETADO!', 480, 270);
      }
    });
  </script>
</body>
</html>
